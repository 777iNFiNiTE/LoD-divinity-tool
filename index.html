<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mount Divinity Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1a1030 0%, #0a0615 60%, #050308 100%);
    color: #fff;
    min-height: 100vh;
  }
  button, input { font-family: inherit; }
  button { transition: background 0.12s ease, filter 0.12s ease, transform 0.06s ease; }
  button:active { transform: scale(0.97); }

  header { text-align: center; padding: 12px 12px 4px; }
  header h1 {
    margin: 0; font-size: 23px; letter-spacing: 1.5px; font-weight: 700;
    background: linear-gradient(180deg,#f5e6b8,#c9a24a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 20px rgba(201,162,74,0.3);
  }
  .summary { text-align: center; font-size: 12px; color: #b9a8d8; margin-top: 3px; letter-spacing: 0.2px; }

  .hidden { display: none !important; }
  .auth-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 8px; flex-wrap: wrap;
  }
  .auth-row .cfg-btn { padding: 7px 12px; font-size: 12.5px; min-height: 36px; }
  .auth-badge {
    font-size: 12px; color: #9fe6ac; background: rgba(159,230,172,0.12);
    border: 1px solid rgba(159,230,172,0.3); border-radius: 20px; padding: 6px 12px;
  }

  .config-bar {
    max-width: 620px; margin: 8px auto 0; padding: 10px;
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(201,162,74,0.18);
    border-radius: 12px;
  }
  .config-bar select, .config-bar input[type=text] {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(201,162,74,0.35);
    color: #f0e6c8; border-radius: 9px; padding: 8px 11px; font-size: 13px;
  }
  .config-bar input[type=text]::placeholder { color: rgba(240,230,200,0.4); }
  .config-bar input[type=text]:focus { outline: none; border-color: #c9a24a; background: rgba(255,255,255,0.1); }
  .config-bar input[type=text] { flex: 1 1 140px; min-width: 100px; }
  .config-bar select { max-width: 160px; }
  .cfg-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,162,74,0.35);
    color: #d8cbee; padding: 8px 12px; border-radius: 9px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
    min-height: 38px;
  }
  .cfg-btn:hover { background: rgba(255,255,255,0.1); }
  .cfg-btn.primary {
    background: linear-gradient(180deg,#7a5cc9,#4a2f8f);
    border-color: #c9a24a; color: #fff; font-weight: 600;
  }
  .cfg-btn.danger { border-color: rgba(220,90,90,0.5); color: #ffb3b3; }
  .cfg-row { display:flex; gap:8px; flex-wrap: wrap; justify-content:center; width:100%; align-items:center; }
  .enter-btn { padding: 7px 10px; font-size: 15px; line-height: 1; flex: 0 0 auto; }
  .name-warning {
    text-align: center; font-size: 11px; color: #ffb35c; min-height: 14px; margin-top: -2px;
  }
  .cfg-status { font-size: 11px; color: #8fd39a; text-align:center; min-height: 14px; margin-top:2px; }

  .sections { padding: 2px 10px 20px; }
  .group-section { max-width: 640px; margin: 0 auto; position: relative; }
  .connector {
    width: 2px; height: 6px; background: linear-gradient(180deg, rgba(201,162,74,0.5), rgba(201,162,74,0.1));
    margin: 0 auto;
  }

  .board-wrap { padding: 4px 10px 20px; }
  .board {
    position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1 / 1.68;
    border-radius: 16px; background: radial-gradient(circle at 50% 10%, rgba(120,90,200,0.12), transparent 60%);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 13%; }
  .icon-ring {
    width: 100%; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden;
    border: 2px solid #c9a24a; box-shadow: 0 0 10px rgba(201,162,74,0.35), inset 0 0 8px rgba(0,0,0,0.5);
    background: #000; position: relative;
  }
  .icon-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon-ring.maxed { border-color: #6dff8a; box-shadow: 0 0 14px rgba(109,255,138,0.6), inset 0 0 8px rgba(0,0,0,0.5); }
  .count-row { display: flex; align-items: center; gap: 3px; margin-top: 4px; }
  .count-row button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(201,162,74,0.5);
    background: rgba(255,255,255,0.1); color: #f0e6c8; font-size: 15px; font-weight: 700;
    line-height: 1; padding: 0; cursor: pointer; user-select: none;
  }
  .count-row button:active { background: rgba(201,162,74,0.45); }
  .count-row button:disabled { opacity: 0.25; cursor: default; }
  .count-label { font-size: 11px; font-weight: 700; min-width: 26px; text-align: center; color: #78ff9a; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
  .count-label.maxed { color: #ffe27a; }

  .controls-bar { max-width: 620px; margin: 4px auto 2px; display: flex; justify-content: center; gap: 7px; padding: 0 14px; flex-wrap: wrap; }
  .controls-bar button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(201,162,74,0.3); color: #d8cbee;
    padding: 8px 12px; border-radius: 9px; font-size: 12.5px; cursor: pointer; min-height: 38px;
  }
  .controls-bar button:hover { background: rgba(255,255,255,0.1); }
  #importFileInput { display: none; }

  .ui-panel {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #140b26 0%, #140b26 85%, rgba(20,11,38,0.97) 100%);
    border-bottom: 1px solid rgba(201,162,74,0.25);
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    padding-bottom: 6px;
  }

  .content-area { max-width: 640px; margin: 0 auto; padding: 0 10px; }

  #toggleBuildsBtn { display: flex; align-items: center; gap: 6px; justify-content: center; }
  #toggleBuildsBtn .count-chip {
    background: rgba(201,162,74,0.3); border-radius: 20px; padding: 1px 7px; font-size: 11px;
  }

  .builds-overlay {
    position: fixed; inset: 0; background: rgba(5,3,10,0.72); backdrop-filter: blur(2px);
    z-index: 900; display: flex; align-items: flex-start; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .builds-overlay.hidden { display: none; }
  .builds-panel {
    width: 100%; max-width: 460px; margin-top: 8px;
    background: radial-gradient(ellipse at top, #241640 0%, #150c28 100%);
    border: 1px solid rgba(201,162,74,0.4); border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 24px rgba(120,90,200,0.15);
    padding: 12px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  }
  .builds-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(201,162,74,0.2);
  }
  .builds-panel-header h3 {
    margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.4px;
    background: linear-gradient(180deg,#f5e6b8,#c9a24a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .builds-panel-header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 42px; height: 42px; flex: 0 0 auto;
    border-radius: 11px; border: 1px solid rgba(201,162,74,0.4);
    background: linear-gradient(180deg,#7a5cc9,#4a2f8f); color: #fff;
    font-size: 21px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { filter: brightness(1.15); }
  .icon-btn.small {
    width: 38px; height: 38px; font-size: 16px; border-radius: 9px;
    background: rgba(255,255,255,0.07); color: #d8cbee; border-color: rgba(201,162,74,0.3);
  }
  .icon-btn.wide {
    width: auto; padding: 0 16px; font-size: 13.5px; font-weight: 600; letter-spacing: 0.2px;
  }
  .icon-btn.danger-icon {
    background: rgba(217,99,90,0.12); color: #ffb3a8; border-color: rgba(217,99,90,0.4);
  }
  .icon-btn.danger-icon:active { background: rgba(217,99,90,0.3); }
  .icon-btn.close-btn {
    background: rgba(255,255,255,0.06); color: #d8cbee; border-color: rgba(201,162,74,0.3);
    font-size: 18px;
  }
  .profile-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .profile-item {
    display: flex; align-items: center; gap: 7px;
    min-height: 50px; padding: 8px 9px; border-radius: 11px;
    border: 1px solid rgba(201,162,74,0.15); background: rgba(255,255,255,0.03);
    transition: background 0.1s;
  }
  .profile-item:hover { background: rgba(255,255,255,0.08); }
  .profile-item.active {
    background: linear-gradient(180deg,#7a5cc9,#4a2f8f); border-color: #c9a24a;
  }
  .profile-item-main { flex: 1 1 auto; min-width: 0; cursor: pointer; padding: 4px 2px; }
  .profile-item .p-name {
    font-size: 14.5px; font-weight: 600; color: #f0e6c8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-item.active .p-name { color: #fff; }
  .profile-item .p-ts { font-size: 11.5px; color: #9f8bc9; margin-top: 3px; }
  .profile-item.active .p-ts { color: #e8dcff; }
  .p-active-badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    color: #ffe27a; margin-top: 3px;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,3,10,0.72); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: radial-gradient(ellipse at top, #241640 0%, #150c28 100%);
    border: 1px solid rgba(201,162,74,0.45); border-radius: 14px;
    max-width: 340px; width: 100%; padding: 16px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 14px 40px rgba(0,0,0,0.6), 0 0 24px rgba(120,90,200,0.15);
  }
  .modal-title {
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 6px;
    background: linear-gradient(180deg,#f5e6b8,#c9a24a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal-box p {
    margin: 0 0 14px; font-size: 13.5px; color: #e4d9f5; line-height: 1.45;
  }
  .modal-box p .modal-target-name { color: #ffe27a; font-weight: 700; }
  .modal-box input[type=text] {
    width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(201,162,74,0.35);
    color: #f0e6c8; border-radius: 8px; padding: 9px 10px; font-size: 14px; margin-bottom: 12px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .modal-actions button {
    padding: 8px 15px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid rgba(201,162,74,0.3);
  }
  .modal-btn-cancel { background: rgba(255,255,255,0.06); color: #d8cbee; }
  .modal-btn-cancel:hover { background: rgba(255,255,255,0.12); }
  .modal-btn-confirm { background: linear-gradient(180deg,#7a5cc9,#4a2f8f); color: #fff; font-weight: 600; }
  .modal-btn-danger {
    background: linear-gradient(180deg,#d9635a,#8a2a1f); color: #fff; font-weight: 600;
    border-color: rgba(255,140,120,0.5);
  }

  /* ---- Mobile tightening: keep the sticky panel compact so it doesn't eat the board area ---- */
  @media (max-width: 480px) {
    header { padding: 8px 10px 3px; }
    header h1 { font-size: 18px; }
    .summary { font-size: 11px; }
    .config-bar { margin-top: 5px; padding: 8px; }
    .cfg-row { gap: 5px; }
    .cfg-btn { padding: 7px 9px; font-size: 12px; min-height: 36px; }
    .enter-btn { padding: 7px 10px; }
    .controls-bar { margin: 3px auto 2px; gap: 5px; }
    .controls-bar button { padding: 7px 9px; font-size: 11px; min-height: 36px; }
    .board { aspect-ratio: 1 / 1.75; }
    .node { width: 14%; }
    .count-row { gap: 4px; margin-top: 5px; }
    .count-row button { width: 24px; height: 24px; font-size: 16px; }
    .count-label { font-size: 11.5px; min-width: 28px; }
  }
</style>
</head>
<body>

<div class="ui-panel" id="uiPanel">
<header>
  <h1>Mount Divinity</h1>
  <div class="summary" id="totalSummary">Loading...</div>
  <div class="auth-row">
    <button class="cfg-btn primary" id="signInBtn">&#128100; Sign in with Google</button>
    <button class="cfg-btn hidden" id="signOutBtn">Sign out</button>
    <span class="auth-badge hidden" id="authUserBadge"></span>
  </div>
</header>

<div class="config-bar">
  <div class="cfg-row">
    <input type="text" id="configNameInput" placeholder="Configuration name">
    <button class="cfg-btn primary enter-btn" id="enterSaveBtn" title="Save (Enter)">&#9166;</button>
  </div>
  <div class="name-warning" id="nameWarning"></div>
  <div class="cfg-row">
    <button class="cfg-btn primary" id="saveConfigBtn">Save</button>
    <button class="cfg-btn" id="toggleBuildsBtn">
      Builds <span class="count-chip" id="buildsCountChip">0</span>
    </button>
  </div>
  <div class="cfg-row">
    <button class="cfg-btn" id="newConfigBtn">New Configuration</button>
    <button class="cfg-btn" id="exportBtn">Export Current</button>
    <button class="cfg-btn" id="importBtn">Import</button>
    <input type="file" id="importFileInput" accept="application/json">
  </div>
  <div class="cfg-status" id="cfgStatus"></div>
</div>

<div class="controls-bar">
  <button id="maxAllBtn">&#9889; Max All</button>
  <button id="resetAllBtn">&#8635; Reset All</button>
  <button id="randomizeBtn">&#127922; Randomize</button>
</div>
</div>

<div class="content-area">
  <div class="sections" id="sections"></div>
</div>

<div class="builds-overlay hidden" id="buildsOverlay">
  <div class="builds-panel">
    <div class="builds-panel-header">
      <h3>Saved Builds</h3>
      <div class="builds-panel-header-actions">
        <button class="icon-btn close-btn" id="closeBuildsBtn" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="profile-list" id="profileList"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <p id="modalMessage"></p>
    <input type="text" id="modalInput" style="display:none;">
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-btn-confirm" id="modalConfirmBtn">OK</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKKinO5Rdw-NPJg7l6RqlQbpbUAXTdzYs",
  authDomain: "lod-divinity-tool--firebase.firebaseapp.com",
  projectId: "lod-divinity-tool--firebase",
  storageBucket: "lod-divinity-tool--firebase.firebasestorage.app",
  messagingSenderId: "323474846247",
  appId: "1:323474846247:web:aa3810cfa8347281e8d402"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();

let currentUser = null;
const CLOUD_COLLECTION = 'users';

const ICONS = JSON.parse(document.getElementById('icon-data').textContent);
const GROUPS = JSON.parse(document.getElementById('group-data').textContent);
const MAXV = 8;
const STORE_KEY = 'mount_divinity_configs_v1';

let allConfigs = {};   // name -> { state: {key:val}, updatedAt: iso }
let activeName = null;
let state = {};

function allKeys() {
  let keys = [];
  GROUPS.forEach(g => g.nodes.forEach(n => keys.push(n.key)));
  return keys;
}

// ---- Custom themed modal (in-app, replaces native confirm()/prompt()) ----
function showConfirm(message, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMessage');
    const inputEl = document.getElementById('modalInput');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');

    titleEl.textContent = opts.title || 'Confirm';
    msgEl.innerHTML = message;
    inputEl.style.display = 'none';
    confirmBtn.textContent = opts.confirmLabel || 'OK';
    confirmBtn.className = opts.danger ? 'modal-btn-danger' : 'modal-btn-confirm';
    overlay.classList.remove('hidden');

    function cleanup(result) {
      overlay.classList.add('hidden');
      confirmBtn.onclick = null;
      cancelBtn.onclick = null;
      resolve(result);
    }
    confirmBtn.onclick = () => cleanup(true);
    cancelBtn.onclick = () => cleanup(false);
  });
}

function showPrompt(message, defaultValue, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMessage');
    const inputEl = document.getElementById('modalInput');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');

    titleEl.textContent = opts.title || 'Name it';
    msgEl.textContent = message;
    inputEl.style.display = 'block';
    inputEl.value = defaultValue || '';
    confirmBtn.textContent = opts.confirmLabel || 'OK';
    confirmBtn.className = 'modal-btn-confirm';
    overlay.classList.remove('hidden');
    setTimeout(() => { inputEl.focus(); inputEl.select(); }, 0);

    function cleanup(result) {
      overlay.classList.add('hidden');
      confirmBtn.onclick = null;
      cancelBtn.onclick = null;
      inputEl.onkeydown = null;
      resolve(result);
    }
    confirmBtn.onclick = () => cleanup(inputEl.value.trim() || null);
    cancelBtn.onclick = () => cleanup(null);
    inputEl.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); cleanup(inputEl.value.trim() || null); }
    };
  });
}

function showAlert(message, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMessage');
    const inputEl = document.getElementById('modalInput');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');

    titleEl.textContent = opts.title || 'Name already in use';
    msgEl.innerHTML = message;
    inputEl.style.display = 'none';
    cancelBtn.style.display = 'none';
    confirmBtn.textContent = opts.confirmLabel || 'OK';
    confirmBtn.className = 'modal-btn-confirm';
    overlay.classList.remove('hidden');

    function cleanup() {
      overlay.classList.add('hidden');
      cancelBtn.style.display = '';
      confirmBtn.onclick = null;
      resolve();
    }
    confirmBtn.onclick = cleanup;
  });
}

function blankState() {
  const s = {};
  allKeys().forEach(k => s[k] = 0);
  return s;
}

async function loadConfigs() {
  try {
    const res = await window.storage.get(STORE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      allConfigs = parsed.configs || {};
      activeName = parsed.active || null;
    }
  } catch (e) { /* nothing saved yet */ }

  if (!allConfigs || Object.keys(allConfigs).length === 0) {
    allConfigs = { "My Build": { state: blankState(), updatedAt: new Date().toISOString() } };
    activeName = "My Build";
  }
  if (!activeName || !allConfigs[activeName]) {
    activeName = Object.keys(allConfigs)[0];
  }
  state = Object.assign(blankState(), allConfigs[activeName].state || {});
}

async function persistConfigs() {
  const payload = JSON.stringify({ configs: allConfigs, active: activeName });
  if (currentUser) {
    try {
      await setDoc(doc(db, CLOUD_COLLECTION, currentUser.uid), {
        data: payload,
        updatedAt: new Date().toISOString(),
        email: currentUser.email || null
      });
      return;
    } catch (e) {
      console.error('cloud save failed', e);
      setStatus('Cloud save failed \u2014 check your connection');
    }
  }
  try {
    await window.storage.set(STORE_KEY, payload, false);
  } catch (e) {
    console.error('save failed', e);
  }
}

function renderAuthUI() {
  const badge = document.getElementById('authUserBadge');
  const signInBtn = document.getElementById('signInBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  if (currentUser) {
    signInBtn.classList.add('hidden');
    signOutBtn.classList.remove('hidden');
    badge.classList.remove('hidden');
    badge.textContent = currentUser.displayName || currentUser.email || 'Signed in';
  } else {
    signInBtn.classList.remove('hidden');
    signOutBtn.classList.add('hidden');
    badge.classList.add('hidden');
    badge.textContent = '';
  }
}

async function handleSignedIn(user) {
  currentUser = user;
  renderAuthUI();
  setStatus('Loading your cloud builds\u2026');
  try {
    const snap = await getDoc(doc(db, CLOUD_COLLECTION, user.uid));
    if (snap.exists() && snap.data().data) {
      const parsed = JSON.parse(snap.data().data);
      allConfigs = parsed.configs || {};
      activeName = parsed.active || Object.keys(allConfigs)[0];
      if (!allConfigs[activeName]) activeName = Object.keys(allConfigs)[0];
      state = Object.assign(blankState(), (allConfigs[activeName] || {}).state || {});
      setStatus('Loaded your saved builds');
    } else {
      // Brand-new account with no cloud data yet: start clean. Do NOT carry
      // over whatever happens to be sitting in memory (that could be another
      // account's data from earlier in this session) -- new user, new slate.
      allConfigs = { "My Build": { state: blankState(), updatedAt: new Date().toISOString() } };
      activeName = "My Build";
      state = blankState();
      await persistConfigs();
      setStatus('Cloud account created \u2014 your builds will now sync');
    }
  } catch (e) {
    console.error('cloud load failed', e);
    setStatus('Could not reach the cloud \u2014 working locally for now');
  }
  renderAll();
}

function handleSignedOut() {
  // Force a hard reload rather than trying to manually reset every piece of
  // in-memory state -- guarantees nothing from the signed-out account lingers
  // on screen or in any cached variable.
  window.location.reload();
}

onAuthStateChanged(auth, (user) => {
  if (user) handleSignedIn(user); else handleSignedOut();
});

function setStatus(msg) {
  const el = document.getElementById('cfgStatus');
  el.textContent = msg;
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
}

function formatTs(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' \u00b7 ' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  } catch (e) { return ''; }
}

function renderConfigBar() {
  document.getElementById('configNameInput').value = activeName;
  checkDuplicateName();
}

function exportStateAsFile(name, exportState) {
  const payload = { name: name, exportedAt: new Date().toISOString(), state: exportState };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = name.replace(/[^a-z0-9\-_]+/gi, '_');
  a.download = safeName + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Exported "' + name + '"');
}

function renderProfileList() {
  const list = document.getElementById('profileList');
  list.innerHTML = '';
  const names = Object.keys(allConfigs).sort((a, b) => {
    const ta = allConfigs[a].updatedAt || '';
    const tb = allConfigs[b].updatedAt || '';
    return tb.localeCompare(ta); // most recent first
  });

  const chip = document.getElementById('buildsCountChip');
  if (chip) chip.textContent = names.length;

  names.forEach(name => {
    const item = document.createElement('div');
    item.className = 'profile-item' + (name === activeName ? ' active' : '');

    const main = document.createElement('div');
    main.className = 'profile-item-main';
    const nameEl = document.createElement('div');
    nameEl.className = 'p-name';
    nameEl.textContent = name;
    const tsEl = document.createElement('div');
    tsEl.className = 'p-ts';
    tsEl.textContent = formatTs(allConfigs[name].updatedAt);
    main.appendChild(nameEl);
    main.appendChild(tsEl);
    if (name === activeName) {
      const badge = document.createElement('div');
      badge.className = 'p-active-badge';
      badge.textContent = '\u2713 Currently loaded';
      main.appendChild(badge);
    }
    // Selecting a build is entirely separate from exporting one -- this handler
    // only ever runs from a tap inside .profile-item-main, never from the export button.
    main.onclick = () => {
      if (name !== activeName) {
        activeName = name;
        state = Object.assign(blankState(), allConfigs[name].state || {});
        persistConfigs();
        renderAll();
      }
      closeBuildsOverlay();
    };
    item.appendChild(main);

    const exportItemBtn = document.createElement('button');
    exportItemBtn.className = 'icon-btn small wide';
    exportItemBtn.title = 'Export "' + name + '"';
    exportItemBtn.textContent = '\u2b07 Export'; // download arrow + label
    // Detached from selection: stops the click from ever reaching profile-item-main,
    // and never touches activeName/state -- exporting never changes what's selected.
    exportItemBtn.onclick = (e) => {
      e.stopPropagation();
      exportStateAsFile(name, allConfigs[name].state);
    };
    item.appendChild(exportItemBtn);

    const deleteItemBtn = document.createElement('button');
    deleteItemBtn.className = 'icon-btn small danger-icon';
    deleteItemBtn.title = 'Delete "' + name + '"';
    deleteItemBtn.textContent = '\u{1F5D1}'; // trash can glyph
    // Also fully detached from selection/export -- deleting never changes activeName
    // unless the deleted build happened to be the active one.
    deleteItemBtn.onclick = (e) => {
      e.stopPropagation();
      deleteConfigByName(name);
    };
    item.appendChild(deleteItemBtn);

    list.appendChild(item);
  });
}

async function deleteConfigByName(name) {
  const names = Object.keys(allConfigs);
  if (names.length <= 1) { setStatus('Cannot delete the only configuration'); return; }
  const ok = await showConfirm('Are you sure you want to delete "<span class="modal-target-name">' + name + '</span>" permanently?', { title: 'Delete configuration', confirmLabel: 'Delete', danger: true });
  if (!ok) return;
  delete allConfigs[name];
  if (activeName === name) {
    activeName = Object.keys(allConfigs)[0];
    state = Object.assign(blankState(), allConfigs[activeName].state || {});
  }
  await persistConfigs();
  renderAll();
  setStatus('Deleted "' + name + '"');
}

function openBuildsOverlay() {
  document.getElementById('buildsOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeBuildsOverlay() {
  document.getElementById('buildsOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

function checkDuplicateName() {
  const input = document.getElementById('configNameInput');
  const warn = document.getElementById('nameWarning');
  const typed = input.value.trim();
  if (typed && typed !== activeName && allConfigs[typed]) {
    warn.textContent = 'A configuration named "' + typed + '" already exists \u2014 choose a different name to save.';
  } else {
    warn.textContent = '';
  }
}

function buildNode(n) {
  const val = state[n.key] || 0;
  const wrap = document.createElement('div');
  wrap.className = 'node';
  wrap.style.left = n.x + '%';
  wrap.style.top = n.y + '%';

  const ring = document.createElement('div');
  ring.className = 'icon-ring' + (val >= MAXV ? ' maxed' : '');
  const img = document.createElement('img');
  img.src = 'data:image/jpeg;base64,' + ICONS[n.key];
  ring.appendChild(img);
  wrap.appendChild(ring);

  const row = document.createElement('div');
  row.className = 'count-row';

  const minus = document.createElement('button');
  minus.textContent = '\u2212';
  minus.disabled = val <= 0;
  minus.onclick = () => changeVal(n.key, -1);

  const label = document.createElement('div');
  label.className = 'count-label' + (val >= MAXV ? ' maxed' : '');
  label.textContent = val + '/' + MAXV;

  const plus = document.createElement('button');
  plus.textContent = '+';
  plus.disabled = val >= MAXV;
  plus.onclick = () => changeVal(n.key, 1);

  row.appendChild(minus);
  row.appendChild(label);
  row.appendChild(plus);
  wrap.appendChild(row);

  return wrap;
}

function renderSections() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  GROUPS.forEach((g, i) => {
    if (i > 0) {
      const connector = document.createElement('div');
      connector.className = 'connector';
      container.appendChild(connector);
    }

    const section = document.createElement('div');
    section.className = 'group-section';
    section.id = 'section-' + i;

    const board = document.createElement('div');
    board.className = 'board';
    g.nodes.forEach(n => board.appendChild(buildNode(n)));
    section.appendChild(board);

    container.appendChild(section);
  });
}

function renderSummary() {
  const keys = allKeys();
  const total = keys.reduce((a,k) => a + (state[k]||0), 0);
  const max = keys.length * MAXV;
  document.getElementById('totalSummary').textContent =
    activeName + ' \u2014 Total: ' + total + ' / ' + max + ' points across all paths';
}

function updatePanelHeightVar() {
  const panel = document.getElementById('uiPanel');
  if (panel) {
    document.documentElement.style.setProperty('--panel-h', panel.offsetHeight + 'px');
  }
}

function renderAll() {
  renderConfigBar();
  renderProfileList();
  renderSections();
  renderSummary();
  updatePanelHeightVar();
}

window.addEventListener('resize', updatePanelHeightVar);

function changeVal(key, delta) {
  const nv = Math.min(MAXV, Math.max(0, (state[key]||0) + delta));
  if (nv === state[key]) return;
  state[key] = nv;
  renderAll();
}

document.getElementById('maxAllBtn').onclick = () => {
  allKeys().forEach(k => state[k] = MAXV);
  renderAll();
};
document.getElementById('resetAllBtn').onclick = () => {
  allKeys().forEach(k => state[k] = 0);
  renderAll();
};
document.getElementById('randomizeBtn').onclick = () => {
  // A uniform per-node roll clusters tightly around the mean (law of large numbers).
  // Pick one random "intensity" for this roll first, then jitter each node around it,
  // so the resulting total actually spans the full 0-1096 range across repeated rolls.
  const intensity = Math.random(); // 0 (empty build) .. 1 (near-maxed build)
  allKeys().forEach(k => {
    const jitter = (Math.random() - 0.5) * 4; // +/- up to 2 pips of noise
    let v = Math.round(intensity * MAXV + jitter);
    v = Math.max(0, Math.min(MAXV, v));
    state[k] = v;
  });
  renderAll();
};

async function saveCurrentConfig() {
  const newName = document.getElementById('configNameInput').value.trim() || activeName;
  if (newName !== activeName && allConfigs[newName]) {
    await showAlert('A configuration named "<span class="modal-target-name">' + newName + '</span>" already exists. Please choose a different name and save again.', { title: 'Name already in use' });
    return;
  }
  allConfigs[newName] = { state: Object.assign({}, state), updatedAt: new Date().toISOString() };
  activeName = newName;
  await persistConfigs();
  renderAll();
  setStatus('Saved "' + newName + '" to the list');
}

document.getElementById('saveConfigBtn').onclick = saveCurrentConfig;
document.getElementById('enterSaveBtn').onclick = saveCurrentConfig;

document.getElementById('configNameInput').addEventListener('input', checkDuplicateName);
document.getElementById('configNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    saveCurrentConfig();
  }
});

document.getElementById('newConfigBtn').onclick = async () => {
  let promptMsg = 'Name for the new configuration:';
  let defaultVal = 'New Build';
  while (true) {
    let name = await showPrompt(promptMsg, defaultVal, { title: 'New Configuration' });
    if (!name) return; // cancelled
    name = name.trim();
    if (!name) return;
    if (allConfigs[name]) {
      promptMsg = 'That name is already taken. Please choose a different name:';
      defaultVal = name;
      continue;
    }
    allConfigs[name] = { state: blankState(), updatedAt: new Date().toISOString() };
    activeName = name;
    state = blankState();
    await persistConfigs();
    renderAll();
    setStatus('Started "' + name + '"');
    return;
  }
};

document.getElementById('exportBtn').onclick = () => {
  exportStateAsFile(activeName, state);
};

document.getElementById('signInBtn').onclick = () => {
  signInWithPopup(auth, googleProvider).catch((e) => {
    console.error('sign-in failed', e);
    setStatus('Sign-in failed or was cancelled');
  });
};
document.getElementById('signOutBtn').onclick = () => {
  signOut(auth).catch((e) => console.error('sign-out failed', e));
};

document.getElementById('toggleBuildsBtn').onclick = openBuildsOverlay;
document.getElementById('closeBuildsBtn').onclick = closeBuildsOverlay;
document.getElementById('buildsOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'buildsOverlay') closeBuildsOverlay();
});

document.getElementById('importBtn').onclick = () => {
  document.getElementById('importFileInput').click();
};

document.getElementById('importFileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed.state || typeof parsed.state !== 'object') throw new Error('Invalid file format');
    let name = parsed.name || file.name.replace(/\.json$/i,'');

    if (allConfigs[name]) {
      let suggestion = name + ' (imported)';
      let n = 2;
      while (allConfigs[suggestion]) { suggestion = name + ' (imported ' + n + ')'; n++; }
      let promptMsg = 'A configuration named "' + name + '" already exists. Choose a different name for the imported build:';
      let defaultVal = suggestion;
      let finalName = null;
      while (true) {
        const entered = await showPrompt(promptMsg, defaultVal, { title: 'Name already in use' });
        if (!entered) { e.target.value = ''; return; } // cancelled
        const trimmed = entered.trim();
        if (!trimmed) { e.target.value = ''; return; }
        if (allConfigs[trimmed]) {
          promptMsg = 'That name is also taken. Please choose a different name:';
          defaultVal = trimmed;
          continue;
        }
        finalName = trimmed;
        break;
      }
      name = finalName;
    }

    const merged = blankState();
    Object.keys(parsed.state).forEach(k => {
      if (k in merged) {
        const v = parseInt(parsed.state[k], 10);
        merged[k] = isNaN(v) ? 0 : Math.min(MAXV, Math.max(0, v));
      }
    });
    allConfigs[name] = { state: merged, updatedAt: new Date().toISOString() };
    activeName = name;
    state = merged;
    await persistConfigs();
    renderAll();
    setStatus('Imported "' + name + '"');
  } catch (err) {
    setStatus('Import failed: invalid file');
  }
  e.target.value = '';
};

(async function init() {
  document.getElementById('totalSummary').textContent = 'Loading saved progress...';
  await loadConfigs();
  renderAll();
})();
</script>
